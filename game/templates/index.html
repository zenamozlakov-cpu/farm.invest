function aiLook(dx,dy){const n=Math.hypot(dx,dy)||1;['#pl','#pr2'].forEach(i=>$(i).style.transform=`translate(${dx/n*2.2}px,${dy/n*1.6}px)`)}
const VN={farm:'ферма',chart:'график',book:'стакан'};
function viewCoach(v){if(G.age===null){vmsg=0;tut(true);return}
const s=get(cur),c=chg(s,20),pct=(Math.abs(c)*100).toFixed(1),y=(G.age||0)==0,need={chart:4,book:5}[v]||0,pre=G.lesson<need?'(Подробный урок про это окно ещё впереди, а пока короткий взгляд.)\n\n':'';let t;
if(v=='chart')t=y?`📈 Это график ${s.n}. Каждая свеча — это кусочек времени: она показывает, где цена началась, где закончилась и как далеко заходила вверх и вниз. Зелёная — цена выросла, красная — упала.\n\nЗа последнее время цена ${c>=0?'выросла':'упала'} на ${pct}%. Найди самую длинную красную свечу: что могло вызвать такое падение?\n\nВ панели сверху можно менять вид графика и включать индикаторы.`:`📈 График ${s.n} (${s.t}): у каждой свечи есть открытие, закрытие, максимум и минимум за период; зелёная — рост, красная — снижение. За последние 20 тиков изменение ${c>=0?'+':'−'}${pct}%.\n\nГде размер свечей резко менялся, и какие новости или события могли на это повлиять? Вид графика и индикаторы настраиваются в панели сверху.`;
else t=y?`📚 Это стакан ${s.n}. Красные строки — те, кто хочет продать, зелёные — те, кто хочет купить. Посередине — текущая цена и спред.\n\nСправа — лента сделок: кто только что купил, а кто продал. Какая сторона сейчас длиннее, красная или зелёная? Что это может говорить о том, кого больше?`:`📚 Стакан ${s.t}: красные уровни — заявки на продажу, зелёные — на покупку, между ними текущая цена, а полоски показывают объём. Между ними — спред, справа лента сделок, глубина рынка и калькулятор заявки.\n\nСравни объёмы сверху и снизу: что они могут говорить о балансе спроса и предложения и почему это не гарантирует направление цены?`;
vmsg=1;setQ(false);$('#co').style.display='none';$('#tm').textContent=pre+t;$('#tb').innerHTML='<button class=b data-n2=1>Вернуться к уроку</button>';$('#tut').style.display='block';aiMove()}
function aiMove(){const M=$('#main'),mr=M.getBoundingClientRect(),mw=M.clientWidth,mh=M.clientHeight,l=G.lesson,
tg=vmsg&&view=='chart'?['#cv','C']:vmsg&&view=='book'?['.bkside','S']:l>=1&&l<=3?['#list','R']:l==4?['[data-v=chart]','L']:l==5?['[data-v=book]','L']:l==6?[$('#field .o')?'#field .o':'#field','I']:null;
const e=tg&&$(tg[0]);if(!e){aiPlace(8,mh-100);aiLook(0,0);return}
const r=e.getBoundingClientRect(),cy=r.top-mr.top,cx=r.left-mr.left;let x,y;
if(tg[1]=='R'){x=mw-72;y=cy+(l==1?60:l==2?120:240)}else if(tg[1]=='L'){x=6;y=cy}else if(tg[1]=='C'){x=cx+10;y=cy+r.height-84}else if(tg[1]=='S'){x=cx+r.width-70;y=cy+8}else if(e.id=='field'){x=cx+r.width/2-32;y=cy+r.height/2}else{x=cx+r.width+10;y=cy+r.height/2-32}
aiPlace(x,y);aiLook(tg[1]=='R'?1:tg[1]=='L'?-1:1,0)}
$('#orb').ondblclick=()=>{$('#ai').style.display='none';$('#aishow').style.display='block'};
$('#aishow').onclick=()=>{$('#ai').style.display='';$('#aishow').style.display='none';aiMove()};
(()=>{const o=$('#orb'),a=$('#ai');let sx,sy,ox,oy,mv=0,wp=0;o.onpointerdown=e=>{wp=!!popT;o.setPointerCapture(e.pointerId);sx=e.clientX;sy=e.clientY;ox=ax;oy=ay;mv=0;o.onpointermove=m=>{if(Math.abs(m.clientX-sx)+Math.abs(m.clientY-sy)>4&&!mv){mv=1;a.classList.add('drag')}if(mv)aiPlace(ox+m.clientX-sx,oy+m.clientY-sy)}};
o.onpointerup=()=>{o.onpointermove=null;a.classList.remove('drag');if(!mv&&!wp){const t=$('#tut');t.style.display=getComputedStyle(t).display=='none'?'block':'none'}}})();
/* ---------- арбузная грядка: растёт всю игру, даёт стартовый капитал ---------- */
const MEL=[12,9,6,3,0,0].map(t=>({t})),MP={p:120},MI=['🌱','🌿','🍈','🍉'];
const mst=m=>m.t>=12?3:m.t>=8?2:m.t>=4?1:0;
function melonDraw(){document.querySelectorAll('#melons .pl').forEach((e,i)=>{const s=mst(MEL[i]);if(e.firstChild&&e.firstChild.nodeType==3)e.firstChild.nodeValue=MI[s];else e.prepend(MI[s]);e.classList.toggle('ripe',s==3)});
const sb=$('#sellm');if(sb)sb.textContent=`🧺 Продать арбузы: ${G.melons} шт · ${fm(MP.p)} ₽/шт`;const mt=$('#mt');if(mt)mt.textContent=`🍉 Арбузная грядка · цена ${fm(MP.p)} ₽`}
function melonCut(i){const m=MEL[i];if(tool!='cut'){coach('msg','Сначала выбери ✂️ Секатор в панели фермы.');return}
if(mst(m)<3){coach('msg','Арбуз ещё не созрел: подожди, пока он станет крупным 🍉.');return}
m.t=0;G.melons++;save();const e=document.querySelectorAll('#melons .pl')[i];e.insertAdjacentHTML('beforeend','<span class=mf>+1 🍉</span>');setTimeout(()=>e.querySelector('.mf')?.remove(),900);melonDraw()}
function sellMelons(){if(!G.melons){coach('msg','Срезанных арбузов нет: возьми секатор ✂️ и срежь спелые.');return}
const n=G.melons,sum=n*MP.p;G.cash+=sum;G.earned+=sum;G.melons=0;save();drawList();melonDraw();coach('melon',n,MP.p)}
setInterval(()=>{MEL.forEach(m=>{if(m.t<12)m.t++});melonDraw()},1000);
setInterval(()=>{MP.p=Math.max(70,Math.min(180,MP.p+(120-MP.p)*.1+(Math.random()-.5)*14))},2000);
/* ---------- навигация и цикл ---------- */
function render(){closePop();({farm:buildField,chart,book})[view]()}
$('#nav').onclick=e=>{const b=e.target.closest('button');if(!b)return;const v=b.dataset.v,need={chart:4,book:5}[v]||0;
view=v;document.querySelectorAll('#nav button').forEach(x=>x.classList.toggle('on',x==b));$('#stage').innerHTML='';render();if(v=='farm'){vmsg=0;tut(true);aiMove()}else{viewCoach(v);if(v=='chart')mark('chart');if(v=='book')mark('book')}}
setInterval(()=>{S.forEach(s=>{const pr=s.p,np=pr*(1+(Math.random()-.5)*.006+.0001+(s.base/pr-1)*.002+s.imp);s.h.push(np);s.h.shift();pushTick(s,pr,np);bookApi.step(s);s.imp*=.93});drawList();updPop();if(view=='farm')updFarm();else if(view=='chart')chart();else if(view=='book')bookApi.update()},2000);
setInterval(()=>{if(G.lesson>=3&&(!G.done.news||Date.now()-lastNews>25000))makeNews()},4000);
drawList();updNav();render();tut();
</script></body></html>
